[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-control"
version = "0.1.0"
description = "Whole-estate version, CVE and upgrade migrations run by Claude agents — scan, plan, gated pull requests — steered from a local dashboard."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Henri Aycard" }]
requires-python = ">=3.9"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]
keywords = ["migration", "cve", "dependency-upgrade", "claude", "claude-code", "agents", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "build>=1"]

[project.scripts]
mig = "migration_control.cli:main"

[tool.setuptools.packages.find]
include = ["migration_control*"]

[tool.setuptools.package-data]
migration_control = ["resources/**/*"]

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
