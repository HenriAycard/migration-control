[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-control"
version = "0.1.0"
description = "Whole-estate version, CVE and upgrade migrations on Claude Managed Agents — with a local control dashboard."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mig = "migration_control.cli:main"

[tool.setuptools.packages.find]
include = ["migration_control*"]

[tool.setuptools.package-data]
migration_control = ["resources/**/*"]
